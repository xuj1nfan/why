[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "why-shell"
version = "0.1.0a1"
description = "A shell-native debugging assistant with memory."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "why contributors"}]
dependencies = []

[project.scripts]
why = "why.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
why = ["why.zsh"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
