[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "why-shell"
version = "0.1.0a1"
description = "A shell-native debugging assistant with memory."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "why contributors"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["build>=1", "pytest>=8"]

[project.scripts]
why = "why.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
why = ["why.bash", "why.zsh"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
